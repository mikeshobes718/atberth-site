<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found. Berth</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
(function(){var d=document.documentElement,t;try{t=localStorage.getItem("berth-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";d.setAttribute("data-theme",t);d.classList.add("js")})();
</script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main id="main" class="hero" style="min-height:100vh;display:grid;place-items:center;text-align:center">
  <div class="glow" aria-hidden="true"></div>
  <div class="wrap">
    <p class="eyebrow"><span class="dot" aria-hidden="true"></span>404</p>
    <h1 style="margin:24px auto 0">This page is not here.</h1>
    <p class="lede" style="margin:20px auto 32px">That address does not match a page on Berth.</p>
    <a class="btn btn-light" href="/">Back to Berth</a>
  </div>
</main>
<script src="/main.js" defer></script>
</body>
</html>
